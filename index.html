<!DOCTYPE html>
<html lang="tr">
<head>

<title>GUROK Sipariş Sistemi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f5f6fa;color:#333;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.kutu{max-width:460px;width:100%;text-align:center}
h1{font-size:22px;color:#1e3a5f;margin-bottom:6px}
p.alt{font-size:14px;color:#777;margin-bottom:28px}
a.kart{display:block;background:#fff;border-radius:12px;padding:22px;margin-bottom:14px;text-decoration:none;
       box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s;text-align:left}
a.kart:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.13)}
a.kart b{display:block;font-size:17px;color:#1e3a5f;margin-bottom:4px}
a.kart span{font-size:13px;color:#888;line-height:1.5}
a.kart span b{color:#1e3a5f}
a.bar{border-left:5px solid #c00000}
a.depo{border-left:5px solid #1a6b3c}
</style>
</head>
<body>
<div class="kutu">
  <h1>GUROK SİPARİŞ SİSTEMİ</h1>
  <p class="alt">ALI BEY CLUB MANAVGAT</p>

  <a class="kart bar" href="bar.html">
    <b>🍹 Sipariş Girişi</b>
    <span>Birim kodunuzu girin, miktarları girip siparişi depoya gönderin.</span>
  </a>

  <a class="kart depo" href="depo.html">
    <b>📦 Depo</b>
    <span>Gelen talepleri görün, miktarları düzeltip onaylayın, LN Infor Excel çıktısını alın.
          Kalem envanterinden ürün çıkışlarını izleyin. Şifre gerekir.</span>
  </a>
</div>
