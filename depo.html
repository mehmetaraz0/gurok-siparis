<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depo Toplama — GUROK</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- ===== Şifre ekranı ===== -->
<div class="kilit" id="kilit">
  <h2>📦 DEPO TOPLAMA</h2>
  <p>Devam etmek için depo şifresini girin</p>
  <input type="password" id="sifre" placeholder="Şifre" autocomplete="current-password">
  <button id="girisBtn" onclick="giris()">Giriş</button>
  <div class="err" id="hata"></div>
</div>

<!-- ===== Ana ===== -->
<div id="ana" style="display:none">
  <div class="hdr">
    <h1 id="hdrBaslik">DEPO — GELEN TALEPLER</h1>
    <div class="hr">
      <span class="canli"><i></i> Canlı</span>
      <input type="date" id="tarih" onchange="yenile()">
      <button class="db" onclick="yenile()">🔄 Yenile</button>
    </div>
  </div>

  <!-- ---- Ekran 1: talep listesi ---- -->
  <div id="ekranListe" style="padding:12px">
    <div class="serit">
      <div class="serit-ust">
        <b id="ozet">Yükleniyor...</b>
        <button class="bekle-btn" id="bekleBtn" onclick="bekleyenlerAcKapa()" style="display:none"></button>
      </div>
      <div class="serit-alt" id="chipler" style="display:none"></div>
    </div>

    <div class="sekmeler">
      <button class="sk aktif" id="skTalep" onclick="sekmeGec('talep')">📋 TALEPLER</button>
      <button class="sk" id="skEnv" onclick="sekmeGec('env')">📦 KALEM ENVANTERİ</button>
      <button class="sk" id="skStok" onclick="sekmeGec('stok')">📊 STOK</button>
    </div>

    <div id="talepler"></div>

    <div id="envanter" style="display:none">
      <div class="env-arac">
        <label>Başlangıç <input type="date" id="envBas"></label>
        <label>Bitiş <input type="date" id="envBit"></label>
        <button class="db" onclick="envanterGetir()">Getir</button>
        <span class="env-hazir" id="envHazir"></span>
        <input class="sb env-ara" id="envAra" placeholder="Ürün ara..." oninput="envFiltre(this.value)">
      </div>

      <div class="depo-header">
        <span>ÜRÜN ÇIKIŞ KAYDI — satıra basınca hangi outlet, ne zaman, kaç adet</span>
        <span class="depo-count" id="envCount">0 kalem</span>
      </div>
      <div id="envIcerik"><div class="em">Tarih aralığı seçip <b>Getir</b>'e basın.</div></div>
    </div>

    <div id="stok" style="display:none">
      <div class="stok-arac">
        <div class="stok-yukle">
          <b>KUM raporu yükle</b>
          <div class="stok-mod">
            <label><input type="radio" name="stokMod" value="baseline" checked>
              <span>Baseline — stoğu <b>Kalan</b>'a eşitle</span></label>
            <label><input type="radio" name="stokMod" value="malkabul">
              <span>Mal kabul — <b>gelen</b>i stoğa ekle</span></label>
          </div>
          <input type="file" id="stokDosya" accept=".xlsx,.xls,.csv,.pdf" onchange="stokDosyaSecildi()">
          <div class="stok-onizle" id="stokOnizle"></div>
          <button class="db" id="stokUygulaBtn" disabled onclick="stokUygula()">Uygula</button>
        </div>
        <input class="sb stok-ara" id="stokAra" placeholder="Ürün ara..." oninput="stokFiltre(this.value)">
      </div>

      <div class="depo-header">
        <span>GÜNCEL STOK</span>
        <span class="depo-count" id="stokCount">—</span>
      </div>
      <div id="stokIcerik"><div class="em">Şifreyle giriş yapıldıktan sonra stok yüklenir.</div></div>
    </div>
  </div>

  <!-- ---- Ekran 2: sipariş detayı ---- -->
  <div id="ekranDetay" style="display:none;padding:12px">
    <button class="geri" onclick="listeyeDon()">← Taleplere dön</button>
    <div id="detayBas"></div>
    <div id="detayIcerik"></div>
  </div>

  <!-- ---- Ekran 3: ürün hareket detayı ---- -->
  <div id="ekranUrun" style="display:none;padding:12px">
    <button class="geri" onclick="envanteraDon()">← Envantere dön</button>
    <div id="urunBas"></div>
    <div id="urunIcerik"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="veri.js"></script>
<script src="config.js"></script>
<script src="ortak.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* ================= Durum ================= */

let SIFRE = null;
let SIPARISLER = [];            // seçili günün siparişleri (talepler ekranı)
let ACIK_NO = null;             // detayı açık siparişin numarası (null ise liste ekranı)
let STOK = null;                // stok listesi (null = henüz çekilmedi)
let stokParsed = null;          // yüklenen dosyadan ayrıştırılan kalemler
let ENVANTER = null;            // envanter aralığının siparişleri (null = henüz çekilmedi)
let ACIK_URUN = null;           // hareket detayı açık ürün kodu (null ise liste ekranı)
let zamanlayici = null;

/* ================= Giriş ================= */

const kayitli = sessionStorage.getItem("gurok_depo_sifre");
if (kayitli) { SIFRE = kayitli; basla(); }

document.getElementById("sifre").addEventListener("keydown", e => {
  if (e.key === "Enter") giris();
});

async function giris() {
  const inp = document.getElementById("sifre");
  const btn = document.getElementById("girisBtn");
  const err = document.getElementById("hata");
  const deger = inp.value.trim();
  if (!deger) return;

  btn.disabled = true;
  btn.textContent = "Kontrol ediliyor...";
  err.textContent = "";

  try {
    const { error } = await SB.rpc("depo_liste", { p_sifre: deger, p_tarih: bugun() });
    if (error) throw error;
    SIFRE = deger;
    sessionStorage.setItem("gurok_depo_sifre", deger);
    basla();
  } catch (e) {
    console.error(e);
    err.textContent = (e.message || "").includes("Sifre")
      ? "Şifre hatalı."
      : "Bağlantı kurulamadı. İnternetinizi kontrol edin.";
    inp.value = "";
    inp.focus();
  }

  btn.disabled = false;
  btn.textContent = "Giriş";
}

function basla() {
  document.getElementById("kilit").style.display = "none";
  document.getElementById("ana").style.display = "";
  document.getElementById("tarih").value = bugun();
  document.getElementById("envBas").value = bugun();
  document.getElementById("envBit").value = bugun();
  yenile();
  zamanlayici = setInterval(otoYenile, 15000);
}

// Otomatik tazeleme, bir sipariş detayı AÇIKKEN çalışmaz: aksi halde depo
// personeli onay miktarını yazarken input yeniden çizilir, girilen değer
// sunucudaki eskisine döner ve yanlış miktar onaylanabilir. Liste ve ürün
// envanteri ekranlarında tazeleme güvenli.
function otoYenile() {
  if (ACIK_NO) return;
  yenile();
}

/* ================= Veri ================= */

async function yenile() {
  const tarih = document.getElementById("tarih").value || bugun();
  try {
    const { data, error } = await SB.rpc("depo_liste", { p_sifre: SIFRE, p_tarih: tarih });
    if (error) throw error;
    SIPARISLER = data || [];
    ciz();
  } catch (e) {
    console.error(e);
    document.getElementById("ozet").textContent = "⚠ Bağlantı hatası — son veriler gösteriliyor";
  }
}

function siparisBul(no) { return SIPARISLER.find(s => s.siparis_no === no) || null; }

// Envanter satırı tıklaması — delegasyon. Ürün kodu data-kod'dan okunur,
// gerçek değerdir (HTML entity çözülmüş), inline handler'a gömülmez.
document.getElementById("envIcerik").addEventListener("click", e => {
  const tr = e.target.closest(".env-sat");
  if (tr && tr.dataset.kod) urunAc(tr.dataset.kod);
});

/* ================= Çizim yönlendirici ================= */

function ciz() {
  if (ACIK_URUN) { cizUrunDetay(); return; }

  if (ACIK_NO) {
    const s = siparisBul(ACIK_NO);
    if (!s) { listeyeDon(); return; }   // sipariş kaybolduysa listeye dön
    cizDetay(s);
    return;
  }

  cizSerit();
  cizTalepler();
  // Envanter kendi tarih aralığını kullanır; açıksa o da tazelensin
  if (ENVANTER && document.getElementById("envanter").style.display !== "none") {
    envanterGetir();
  }
}

/* ================= Ekran 1: liste ================= */

function sekmeGec(hangi) {
  document.getElementById("talepler").style.display  = hangi === "talep" ? "" : "none";
  document.getElementById("envanter").style.display  = hangi === "env"   ? "" : "none";
  document.getElementById("stok").style.display      = hangi === "stok"  ? "" : "none";
  document.getElementById("skTalep").classList.toggle("aktif", hangi === "talep");
  document.getElementById("skEnv").classList.toggle("aktif",   hangi === "env");
  document.getElementById("skStok").classList.toggle("aktif",  hangi === "stok");

  if (hangi === "env"  && !ENVANTER) envanterGetir();
  if (hangi === "stok" && !STOK)     stokGetir();
}

// Hangi barın gönderdiği zaten talep listesinde görünüyor; burada sadece
// GÖNDERMEYEN barlar var — ve o da katlanır, çünkü çoğu zaman gerekmez.
let bekleyenlerAcik = false;

function cizSerit() {
  const gelenler = new Set(SIPARISLER.map(s => s.outlet_kod));
  const onayli = SIPARISLER.filter(s => s.durum === "onaylandi").length;
  const bekleyenler = D.filter(o => !gelenler.has(o.c));

  document.getElementById("ozet").textContent =
    SIPARISLER.length + " sipariş · " + onayli + " onaylandı · "
    + (SIPARISLER.length - onayli) + " onay bekliyor";

  const btn = document.getElementById("bekleBtn");
  const kutu = document.getElementById("chipler");

  if (!bekleyenler.length) {
    btn.style.display = "none";
    kutu.style.display = "none";
    return;
  }

  btn.style.display = "";
  btn.textContent = bekleyenler.length + " bar sipariş göndermedi "
                  + (bekleyenlerAcik ? "▴" : "▾");

  kutu.style.display = bekleyenlerAcik ? "" : "none";
  kutu.innerHTML = bekleyenler.map(o =>
    '<span class="chip bekliyor" title="' + htmlEsc(o.n) + '">'
    + htmlEsc(kisaKod(o.c)) + ' ' + htmlEsc(o.n) + '</span>').join("");
}

function bekleyenlerAcKapa() {
  bekleyenlerAcik = !bekleyenlerAcik;
  cizSerit();
}

function cizTalepler() {
  const k = document.getElementById("talepler");

  if (!SIPARISLER.length) {
    k.innerHTML = '<div class="em">Bu tarihte gönderilmiş sipariş yok.</div>';
    return;
  }

  let h = '<div class="talep-bas">'
        + '<span>SİPARİŞ NO</span><span>BAR</span><span>SAAT</span>'
        + '<span>KALEM</span><span>DURUM</span><span></span></div>';

  SIPARISLER.forEach(s => {
    const onaylandi = s.durum === "onaylandi";
    const verilmeyen = s.kalemler.filter(it => gecerliMiktar(it) === 0).length;
    // Miktarı değişmiş ama tamamen iptal edilmemiş kalemler ("verilmedi" ile çakışmasın)
    const duzeltilen = s.kalemler.filter(it =>
      it.o !== undefined && it.o !== null && it.o !== it.m && it.o > 0).length;

    h += '<div class="talep-sat' + (onaylandi ? " onayli" : "") + '"'
       + ' onclick="detayAc(\'' + htmlEsc(s.siparis_no) + '\')">'
       + '<span class="tno">' + htmlEsc(s.siparis_no) + '</span>'
       + '<span><b>' + htmlEsc(kisaKod(s.outlet_kod)) + '</b> ' + htmlEsc(s.outlet_ad)
       + (s.bolum ? ' <i class="bolum-et">' + htmlEsc(s.bolum) + '</i>' : '') + '</span>'
       + '<span>' + saat(s.gonderilme_saati) + '</span>'
       + '<span>' + s.kalemler.length + ' kalem'
       + (duzeltilen ? ' <i class="uyari">' + duzeltilen + ' düzeltildi</i>' : '')
       + (verilmeyen ? ' <i class="uyari">' + verilmeyen + ' verilmedi</i>' : '')
       + '</span>'
       + '<span>' + (onaylandi
            ? '<span class="rz onay">✅ Onaylandı ' + (s.onay_saati ? saat(s.onay_saati) : "") + '</span>'
            : '<span class="rz talep">🟡 Talep</span>') + '</span>'
       + '<span class="ileri">›</span>'
       + '</div>';
  });

  k.innerHTML = h;
}

/* ================= Kalem envanteri =================
   Ürün bazında çıkış kaydı. ÇIKAN = onaylanmış siparişlerdeki onay miktarı
   (depodan gerçekten çıkan mal). BEKLEYEN = henüz onaylanmamış talepler.
   Satıra basılınca o ürünün tek tek hareketleri açılır. */

async function envanterGetir() {
  const bas = document.getElementById("envBas").value || bugun();
  const bit = document.getElementById("envBit").value || bugun();
  const kutu = document.getElementById("envIcerik");

  kutu.innerHTML = '<div class="em">Yükleniyor...</div>';
  document.getElementById("envHazir").textContent = "";

  try {
    const { data, error } = await SB.rpc("depo_envanter", {
      p_sifre: SIFRE, p_bas: bas, p_bit: bit
    });
    if (error) throw error;
    ENVANTER = data || [];
    if (ACIK_URUN) cizUrunDetay(); else cizEnvanter();
  } catch (e) {
    console.error(e);
    ENVANTER = null;
    kutu.innerHTML = '<div class="em">⚠ Envanter alınamadı: '
                   + htmlEsc(e.message || "bağlantı hatası") + '</div>';
  }
}

// Siparişleri ürün bazında toplar
function envanterTopla() {
  const urun = {};
  let siparisSayisi = 0, hareketSayisi = 0;

  (ENVANTER || []).forEach(s => {
    siparisSayisi++;
    const onayli = s.durum === "onaylandi";

    s.kalemler.forEach(it => {
      const miktar = gecerliMiktar(it);
      if (miktar <= 0) return;              // verilmedi işaretli kalem

      if (!urun[it.k]) {
        urun[it.k] = { k: it.k, a: it.a, b: it.b, g: it.g,
                       cikan: 0, bekleyen: 0, hareketler: [] };
      }
      const u = urun[it.k];
      if (onayli) u.cikan += miktar; else u.bekleyen += miktar;

      u.hareketler.push({
        siparis_no: s.siparis_no,
        outlet_kod: s.outlet_kod,
        outlet_ad:  s.outlet_ad,
        bolum:      s.bolum || null,
        istendi:    s.gonderilme_saati,
        cikti:      s.onay_saati,
        talep:      it.m,
        miktar:     miktar,
        onayli:     onayli
      });
      hareketSayisi++;
    });
  });

  Object.values(urun).forEach(u =>
    u.hareketler.sort((a, b) => new Date(b.istendi) - new Date(a.istendi)));

  return { urun, siparisSayisi, hareketSayisi };
}

function cizEnvanter() {
  const kutu = document.getElementById("envIcerik");
  const { urun, siparisSayisi, hareketSayisi } = envanterTopla();
  const kodlar = Object.keys(urun);

  document.getElementById("envCount").textContent = kodlar.length + " kalem";
  document.getElementById("envHazir").textContent =
    siparisSayisi + " sipariş · " + hareketSayisi + " hareket";

  if (!kodlar.length) {
    // Boşsa nedenini söyle — sessiz boş ekran bırakma
    kutu.innerHTML = '<div class="em">'
      + (siparisSayisi === 0
          ? "Bu tarih aralığında hiç sipariş yok."
          : siparisSayisi + " sipariş bulundu, ama hiçbirinde çıkacak kalem yok "
            + "(tüm kalemler 0 / verilmedi işaretli).")
      + '</div>';
    return;
  }

  // Düz liste, ürün koduna göre sıralı. Gruplama yok: envanter yüzlerce satıra
  // çıkabilir, kod sırası aramayı ve LN Infor'la karşılaştırmayı kolaylaştırır.
  kodlar.sort((a, b) => a.localeCompare(b, "en"));

  let h = '<table class="env-tbl"><thead><tr>'
        + '<th>KOD</th><th>ÜRÜN ADI</th><th>BR</th><th>ÇIKAN</th><th>BEKLEYEN</th>'
        + '<th>HAREKET</th><th></th>'
        + '</tr></thead><tbody>';

  kodlar.forEach(k => {
    const u = urun[k];
    // Ürün kodu kullanıcı (anon RPC) tarafından yazılabildiği için onclick
    // string'ine GÖMÜLMEZ; data-kod ile taşınır, tıklama delegasyonla yakalanır.
    h += '<tr class="env-sat" data-ara="' + htmlEsc((u.a + " " + u.k).toLowerCase()) + '"'
       + ' data-kod="' + htmlEsc(k) + '">'
       + '<td style="font-family:monospace;font-size:11px">' + htmlEsc(k) + '</td>'
       + '<td>' + htmlEsc(u.a) + '</td>'
       + '<td style="text-align:center">' + htmlEsc(u.b) + '</td>'
       + '<td class="say cikan' + (u.cikan ? "" : " sifir") + '">' + (u.cikan || "—") + '</td>'
       + '<td class="say bekleyen">' + (u.bekleyen || "—") + '</td>'
       + '<td class="say hrk-say">' + u.hareketler.length + '</td>'
       + '<td class="say"><span class="ileri">›</span></td>'
       + '</tr>';
  });

  kutu.innerHTML = h + '</tbody></table>';
  envFiltre(document.getElementById("envAra").value);
}

function envFiltre(t) {
  t = (t || "").toLowerCase().trim();
  let gorunen = 0;
  document.querySelectorAll("#envIcerik tr[data-ara]").forEach(tr => {
    const uygun = !t || tr.dataset.ara.includes(t);
    tr.style.display = uygun ? "" : "none";
    if (uygun) gorunen++;
  });
  if (t) document.getElementById("envCount").textContent = gorunen + " kalem (filtreli)";
}

/* ---- Ekran 3: bir ürünün hareketleri ---- */

function urunAc(kod) {
  ACIK_URUN = kod;
  document.getElementById("ekranListe").style.display = "none";
  document.getElementById("ekranUrun").style.display = "";
  window.scrollTo(0, 0);
  ciz();
}

function envanteraDon() {
  ACIK_URUN = null;
  document.getElementById("ekranUrun").style.display = "none";
  document.getElementById("ekranListe").style.display = "";
  document.getElementById("hdrBaslik").textContent = "DEPO — GELEN TALEPLER";
  window.scrollTo(0, 0);
  ciz();
}

function cizUrunDetay() {
  const { urun } = envanterTopla();
  const u = urun[ACIK_URUN];

  if (!u) {                       // aralık değiştiyse ürün listeden düşmüş olabilir
    document.getElementById("urunBas").innerHTML = "";
    document.getElementById("urunIcerik").innerHTML =
      '<div class="em">Bu ürünün seçili tarih aralığında hareketi yok.</div>';
    return;
  }

  document.getElementById("hdrBaslik").textContent = "DEPO — " + u.a;

  const bas = document.getElementById("envBas").value || bugun();
  const bit = document.getElementById("envBit").value || bugun();

  document.getElementById("urunBas").innerHTML =
      '<div class="detay-bas">'
    + '<div>'
    + '<div class="dno">' + htmlEsc(u.k) + '</div>'
    + '<div class="dbar">' + htmlEsc(u.a) + ' &nbsp;·&nbsp; ' + htmlEsc(u.b)
    + ' &nbsp;·&nbsp; ' + htmlEsc(bas) + ' — ' + htmlEsc(bit) + '</div>'
    + '</div>'
    + '<div class="detay-btn">'
    + '<span class="ozet-kutu cikan"><b>' + u.cikan + '</b><span>ÇIKAN</span></span>'
    + '<span class="ozet-kutu bekleyen"><b>' + u.bekleyen + '</b><span>BEKLEYEN</span></span>'
    + '<span class="ozet-kutu"><b>' + u.hareketler.length + '</b><span>HAREKET</span></span>'
    + '</div></div>';

  let h = '<table class="detay-tbl"><thead><tr>'
        + '<th>OUTLET</th><th>SİPARİŞ NO</th><th>İSTENDİ</th><th>ÇIKTI</th>'
        + '<th>TALEP</th><th>MİKTAR</th><th>DURUM</th>'
        + '</tr></thead><tbody>';

  u.hareketler.forEach(hr => {
    h += '<tr class="' + (hr.onayli ? "" : "bekleyen-sat") + '">'
       + '<td><b>' + htmlEsc(kisaKod(hr.outlet_kod)) + '</b> ' + htmlEsc(hr.outlet_ad)
       + (hr.bolum ? ' <i class="bolum-et">' + htmlEsc(hr.bolum) + '</i>' : '') + '</td>'
       + '<td style="font-family:monospace;font-size:10px">' + htmlEsc(hr.siparis_no) + '</td>'
       + '<td style="white-space:nowrap">' + tarihSaat(hr.istendi) + '</td>'
       + '<td style="white-space:nowrap">' + (hr.onayli ? tarihSaat(hr.cikti) : "—") + '</td>'
       + '<td style="text-align:center' + (hr.talep !== hr.miktar ? ';color:#b26500' : '') + '">'
       + hr.talep + '</td>'
       + '<td style="text-align:center;font-weight:700;font-size:14px">' + hr.miktar + '</td>'
       + '<td>' + (hr.onayli ? '<span class="rz onay">✅ çıktı</span>'
                             : '<span class="rz talep">🟡 bekliyor</span>') + '</td>'
       + '</tr>';
  });

  document.getElementById("urunIcerik").innerHTML = h + '</tbody></table>';
}

/* ================= Ekran 2: sipariş detayı ================= */

function detayAc(no) {
  ACIK_NO = no;
  document.getElementById("ekranListe").style.display = "none";
  document.getElementById("ekranDetay").style.display = "";
  document.getElementById("hdrBaslik").textContent = "DEPO — SİPARİŞ " + no;
  window.scrollTo(0, 0);
  ciz();
}

function listeyeDon() {
  ACIK_NO = null;
  document.getElementById("ekranDetay").style.display = "none";
  document.getElementById("ekranListe").style.display = "";
  document.getElementById("hdrBaslik").textContent = "DEPO — GELEN TALEPLER";
  window.scrollTo(0, 0);
  ciz();
}

function cizDetay(s) {
  const onaylandi = s.durum === "onaylandi";

  document.getElementById("detayBas").innerHTML =
      '<div class="detay-bas">'
    + '<div>'
    + '<div class="dno">' + htmlEsc(s.siparis_no) + '</div>'
    + '<div class="dbar"><b>' + htmlEsc(kisaKod(s.outlet_kod)) + '</b> — ' + htmlEsc(s.outlet_ad)
    + (s.bolum ? ' <i class="bolum-et">' + htmlEsc(s.bolum) + '</i>' : '')
    + ' &nbsp;·&nbsp; ' + saat(s.gonderilme_saati) + ' &nbsp;·&nbsp; ' + s.kalemler.length + ' kalem</div>'
    + '</div>'
    + '<div class="detay-btn">'
    + (onaylandi
        ? '<span class="rz onay">✅ Onaylandı ' + (s.onay_saati ? saat(s.onay_saati) : "") + '</span>'
          + '<button class="cb" style="display:inline-block;width:auto;margin:0;padding:9px 16px" '
          + 'onclick="durumDegistir(\'talep\')">🔓 Kilidi Aç</button>'
        : '<button class="gb" onclick="durumDegistir(\'onaylandi\')">✅ ONAYLA ve KİLİTLE</button>')
    + '<button class="db" id="exBtn" onclick="detayExcel()">⬇ Excel İndir</button>'
    + '</div></div>';

  let h = '<table class="detay-tbl"><thead><tr>'
        + '<th>KOD</th><th>ÜRÜN ADI</th><th>BR</th><th>TALEP</th><th>ONAY</th>'
        + '</tr></thead><tbody>';

  s.kalemler.forEach(it => {
    const onay = gecerliMiktar(it);
    const degisti = it.o !== undefined && it.o !== null && it.o !== it.m;
    h += '<tr class="' + (onay === 0 ? "verilmedi" : (degisti ? "degisti" : "")) + '">'
       + '<td style="font-family:monospace;font-size:10px">' + htmlEsc(it.k) + '</td>'
       + '<td>' + htmlEsc(it.a) + '</td>'
       + '<td style="text-align:center">' + htmlEsc(it.b) + '</td>'
       + '<td style="text-align:center;font-weight:700">' + it.m + '</td>'
       + '<td style="text-align:center">'
       + '<input type="number" min="0" class="onay-inp" value="' + onay + '"'
       + ' data-k="' + htmlEsc(it.k) + '" data-eski="' + onay + '"'
       + (onaylandi ? " disabled" : "")
       + ' onchange="kalemKaydet(this)" onfocus="this.select()">'
       + '</td></tr>';
  });

  document.getElementById("detayIcerik").innerHTML = h + '</tbody></table>'
    + '<div class="detay-not">Onay sütununa <b>0</b> yazılan ürün verilmedi sayılır; '
    + 'Excel çıktısına ve konsolide toplama girmez.</div>';
}

async function kalemKaydet(inp) {
  const yeni = parseInt(inp.value);
  const eski = parseInt(inp.dataset.eski);

  if (isNaN(yeni) || yeni < 0) { inp.value = eski; return; }
  if (yeni === eski) return;

  inp.disabled = true;
  try {
    const { error } = await SB.rpc("depo_kalem_guncelle", {
      p_sifre: SIFRE, p_siparis_no: ACIK_NO,
      p_kalem_kod: inp.dataset.k, p_onay: yeni
    });
    if (error) throw error;

    // Yerel kopyayı da güncelle ki bir sonraki çizim doğru olsun
    const s = siparisBul(ACIK_NO);
    const it = s.kalemler.find(x => x.k === inp.dataset.k);
    if (it) it.o = yeni;

    inp.dataset.eski = yeni;
    inp.disabled = false;
    inp.classList.add("kaydedildi");
    setTimeout(() => inp.classList.remove("kaydedildi"), 1200);
    cizDetay(s);

  } catch (e) {
    console.error(e);
    inp.value = eski;
    inp.disabled = false;
    alert("Kaydedilemedi: " + (e.message || "bağlantı hatası"));
  }
}

async function durumDegistir(yeniDurum) {
  const s = siparisBul(ACIK_NO);
  if (!s) return;

  if (yeniDurum === "onaylandi") {
    const verilmeyen = s.kalemler.filter(it => gecerliMiktar(it) === 0).length;
    if (!confirm(s.siparis_no + " onaylanacak ve kilitlenecek.\n\n"
               + (verilmeyen ? verilmeyen + " ürün verilmedi olarak işaretli.\n" : "")
               + "Kilitli siparişte düzeltme yapılamaz (kilidi açabilirsiniz).\n\nOnaylansın mı?")) return;
  }

  try {
    const { error } = await SB.rpc("depo_durum_degistir", {
      p_sifre: SIFRE, p_siparis_no: ACIK_NO, p_durum: yeniDurum
    });
    if (error) throw error;
    await yenile();
  } catch (e) {
    console.error(e);
    alert("İşlem yapılamadı: " + (e.message || "bağlantı hatası"));
  }
}

/* ================= Excel ================= */

async function detayExcel() {
  const s = siparisBul(ACIK_NO);
  if (!s) return;

  const btn = document.getElementById("exBtn");
  btn.disabled = true;
  btn.textContent = "⏳ Hazırlanıyor...";
  try {
    await indirExcel(s.outlet_kod, s.outlet_ad, s.kalemler, s.siparis_no);
    btn.textContent = "✅ İndirildi";
    btn.classList.add("ok");
  } catch (e) {
    console.error(e);
    btn.textContent = "❌ " + (e.message === "Onaylanan kalem yok" ? "Onaylanan kalem yok" : "Hata");
  }
  setTimeout(() => {
    btn.textContent = "⬇ Excel İndir";
    btn.classList.remove("ok");
    btn.disabled = false;
  }, 2500);
}

/* ================= STOK ================= */

async function stokGetir() {
  const kutu = document.getElementById("stokIcerik");
  kutu.innerHTML = '<div class="em">Yükleniyor...</div>';
  try {
    const { data, error } = await SB.rpc("stok_liste", { p_sifre: SIFRE });
    if (error) throw error;
    STOK = data || [];
    cizStok();
  } catch (e) {
    console.error(e);
    STOK = null;
    kutu.innerHTML = '<div class="em">⚠ Stok alınamadı: ' + htmlEsc(e.message || "hata")
                   + '<br><small>guncelleme-06.sql çalıştırıldı mı?</small></div>';
  }
}

function cizStok() {
  const kutu = document.getElementById("stokIcerik");
  document.getElementById("stokCount").textContent = (STOK ? STOK.length : 0) + " kalem";

  if (!STOK || !STOK.length) {
    kutu.innerHTML = '<div class="em">Henüz stok yüklenmedi. Yukarıdan KUM raporu yükleyin.</div>';
    return;
  }

  let h = '<table class="stok-tbl"><thead><tr>'
        + '<th>KOD</th><th>ÜRÜN ADI</th><th>BR</th><th>STOK</th><th>GÜNCELLEME</th>'
        + '</tr></thead><tbody>';
  STOK.forEach(s => {
    const m = Number(s.miktar);
    const sinif = m < 0 ? "negatif" : (m === 0 ? "sifir" : (m <= 5 ? "dusuk" : ""));
    h += '<tr class="stok-sat ' + sinif + '" data-ara="' + htmlEsc((s.ad + " " + s.kod).toLowerCase()) + '">'
       + '<td style="font-family:monospace;font-size:11px">' + htmlEsc(s.kod) + '</td>'
       + '<td>' + htmlEsc(s.ad || "") + '</td>'
       + '<td style="text-align:center">' + htmlEsc(s.birim || "") + '</td>'
       + '<td class="say miktar">' + (Number.isInteger(m) ? m : m.toFixed(2)) + '</td>'
       + '<td style="font-size:11px;color:#888">' + (s.guncelleme ? tarihSaat(s.guncelleme) : "—") + '</td>'
       + '</tr>';
  });
  kutu.innerHTML = h + '</tbody></table>';
  stokFiltre(document.getElementById("stokAra").value);
}

function stokFiltre(t) {
  t = (t || "").toLowerCase().trim();
  let n = 0;
  document.querySelectorAll("#stokIcerik tr[data-ara]").forEach(tr => {
    const u = !t || tr.dataset.ara.includes(t);
    tr.style.display = u ? "" : "none";
    if (u) n++;
  });
  if (t) document.getElementById("stokCount").textContent = n + " kalem (filtreli)";
}

/* ---- Dosya oku (Excel / PDF) ---- */

async function stokDosyaSecildi() {
  const f = document.getElementById("stokDosya").files[0];
  const onizle = document.getElementById("stokOnizle");
  const btn = document.getElementById("stokUygulaBtn");
  stokParsed = null;
  btn.disabled = true;
  if (!f) { onizle.textContent = ""; return; }

  onizle.textContent = "⏳ Okunuyor: " + f.name;
  try {
    const ad = f.name.toLowerCase();
    let kalemler;
    if (ad.endsWith(".pdf")) {
      kalemler = await stokPdfOku(f);
    } else {
      kalemler = await stokExcelOku(f);
    }
    if (!kalemler.length) {
      onizle.innerHTML = '<span class="hata">Dosyadan kalem okunamadı. '
        + 'KUM raporu biçiminde mi? Excel sorun çıkarırsa PDF deneyin.</span>';
      return;
    }
    stokParsed = kalemler;
    const mod = document.querySelector('input[name=stokMod]:checked').value;
    const ornek = kalemler.slice(0, 3).map(k =>
      k.k + " " + (mod === "baseline" ? "→ " + k.kalan : "+ " + k.gelen)).join(" · ");
    onizle.innerHTML = '<b>' + kalemler.length + ' kalem okundu.</b> '
      + (mod === "malkabul"
          ? '(' + kalemler.filter(k => k.gelen > 0).length + ' kalemde gelen > 0) '
          : '')
      + '<br><small>' + htmlEsc(ornek) + ' …</small>';
    btn.disabled = false;
  } catch (e) {
    console.error(e);
    onizle.innerHTML = '<span class="hata">Okuma hatası: ' + htmlEsc(e.message || "") + '</span>';
  }
}

function stokExcelOku(file) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onerror = () => reject(new Error("dosya okunamadı"));
    rd.onload = () => {
      try {
        const wb = XLSX.read(rd.result, { type: "array" });
        // Her sayfadaki her satırı boşlukla birleştirip KUM satır ayrıştırıcısına ver.
        const satirlar = [];
        wb.SheetNames.forEach(ad => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[ad], { header: 1, raw: false, defval: "" });
          rows.forEach(r => satirlar.push(r.join(" ")));
        });
        resolve(kumParse(satirlar));
      } catch (e) { reject(e); }
    };
    rd.readAsArrayBuffer(file);
  });
}

async function stokPdfOku(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const satirlar = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    // Aynı y konumundaki parçaları tek satır olarak grupla
    const gruplar = {};
    tc.items.forEach(it => {
      const y = Math.round(it.transform[5]);
      (gruplar[y] = gruplar[y] || []).push({ x: it.transform[4], s: it.str });
    });
    Object.keys(gruplar).map(Number).sort((a, b) => b - a).forEach(y => {
      satirlar.push(gruplar[y].sort((a, b) => a.x - b.x).map(o => o.s).join(" "));
    });
  }
  return kumParse(satirlar);
}

async function stokUygula() {
  if (!stokParsed || !stokParsed.length) return;
  const mod = document.querySelector('input[name=stokMod]:checked').value;
  const btn = document.getElementById("stokUygulaBtn");

  // Sunucuya {k, a, b, m} gönderilir. Baseline'da m=kalan, mal kabulde m=gelen.
  const kalemler = stokParsed.map(k => ({
    k: k.k, a: k.a, b: k.b, m: mod === "baseline" ? k.kalan : k.gelen
  }));

  if (mod === "baseline" &&
      !confirm("BASELINE: " + kalemler.length + " kalemin stoğu rapordaki Kalan'a EŞİTLENECEK.\n\n"
             + "Bu, mevcut stok sayılarının üzerine yazar. Devam edilsin mi?")) return;

  btn.disabled = true;
  btn.textContent = "⏳ Uygulanıyor...";
  try {
    const fn = mod === "baseline" ? "stok_baseline" : "stok_malkabul";
    const { data, error } = await SB.rpc(fn, { p_sifre: SIFRE, p_kalemler: kalemler });
    if (error) throw error;
    btn.textContent = "✅ " + (data.adet ?? "") + " kalem işlendi";
    document.getElementById("stokDosya").value = "";
    document.getElementById("stokOnizle").textContent = "";
    stokParsed = null;
    await stokGetir();
    setTimeout(() => { btn.textContent = "Uygula"; }, 2500);
  } catch (e) {
    console.error(e);
    btn.textContent = "❌ Hata";
    alert("Uygulanamadı: " + (e.message || "bağlantı hatası"));
    setTimeout(() => { btn.textContent = "Uygula"; btn.disabled = false; }, 2500);
  }
}
