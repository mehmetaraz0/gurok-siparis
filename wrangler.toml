# Cloudflare Workers — statik site (Workers Static Assets).
# Sunucu tarafı kod YOK; yalnızca dosyalar sunulur. _headers dosyası burada
# geçerlidir (GitHub Pages özel başlık desteklemiyordu — taşımanın sebebi bu).
name = "gurok-siparis"
compatibility_date = "2026-08-31"

[assets]
directory = "./"
# Varsayılan davranış /bar.html -> /bar yönlendirmesi yapıyordu. Personelin
# kayıtlı linkleri .html ile; gereksiz yönlendirme olmasın diye kapatıldı.
html_handling = "none"
