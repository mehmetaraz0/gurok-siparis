<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Bar Sipariş Girişi — GUROK</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- ===== Giriş ekranı (personel: bar kaptanı + mutfak) ===== -->
<div class="kilit" id="kilit">
  <h2>SİPARİŞ GİRİŞİ</h2>
  <div id="kaptanGirisKutu">
    <p>Kullanıcı girişi</p>
    <input type="text" id="kaptanKod" placeholder="Kullanıcı adı" autocomplete="off" maxlength="10" autocapitalize="off">
    <input type="password" id="kaptanPin" placeholder="PIN" autocomplete="off" maxlength="12" inputmode="numeric">
    <button id="kaptanBtn" onclick="kaptanGiris()">Devam</button>
    <div class="err" id="kaptanHata"></div>
  </div>
</div>

<!-- ===== Birim seçim ekranı (giriş sonrası: bar + mutfak) ===== -->
<div class="kilit" id="barEkran" style="display:none">
  <h2>BİRİM SEÇ</h2>
  <p id="kaptanAdEt">—</p>
  <div id="barButonlar"></div>
  <button class="cb" style="margin-top:14px" onclick="kaptanSifreDegistir()">🔑 Şifremi değiştir</button>
  <button class="cb" style="margin-top:8px" onclick="kaptanaCik()">← Çıkış</button>
</div>

<!-- ===== Bölüm seçim ekranı (çok bölümlü mutfaklar) ===== -->
<div class="kilit" id="bolumEkran" style="display:none">
  <h2 id="bolumBaslik">MUTFAK</h2>
  <p>Bölümünüzü seçin</p>
  <div id="bolumButonlar"></div>
  <button class="cb" style="margin-top:14px" onclick="birimSecimGoster()">← Birim seçime dön</button>
</div>

<!-- ===== Ana ekran ===== -->
<div id="ana" style="display:none">
<div class="hdr">
  <h1>SİPARİŞ GİRİŞİ</h1>
  <div class="hr">
    <span class="outlet-ad" id="outletAd">—</span>
    <button class="cb" style="display:inline-block;width:auto;margin:0;padding:8px 14px" onclick="barDegistir()">↔ Birim Değiştir</button>
    <span class="dz yok" id="durum">—</span>
    <button class="gb" id="gb" disabled onclick="gonder()">📤 Siparişi Gönder</button>
  </div>
</div>

<div class="mn">
  <div class="lp" id="lp"><div class="em">Yükleniyor...</div></div>
  <div class="sp">
    <div class="st">ÖZET RAPOR</div>
    <div class="sc">Kalem: <span id="cnt">0</span></div>
    <table class="tb">
      <thead><tr><th>KOD</th><th>AD</th><th>MİKTAR</th><th>BİRİM</th></tr></thead>
      <tbody id="stb"></tbody>
    </table>
    <button class="cb" onclick="clr()">Tümünü Temizle</button>

    <div class="makbuz" id="makbuz" style="display:none">
      <div class="makbuz-bas">BUGÜN GÖNDERDİKLERİNİZ</div>
      <div id="makbuzListe"></div>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="veri.js"></script>
<script src="mutfak.js"></script>
<script src="config.js"></script>
<script src="ortak.js"></script>
<script>
/* ================= Durum ================= */

let Q = {};          // outletKod -> {kalemKod: miktar}
let C = null;        // seçili outlet
let kirli = false;   // gönderilmemiş değişiklik var mı
let siparisId = null; // idempotency: bu sipariş denemesinin istemci kimliği
let GIZLI = new Set(); // stoğu 0/negatif → listede gizlenecek kodlar
let BULUT_KATALOG = false;  // bulut katalogu yüklendi mi (min sınırları oradan gelir)
// NOT: eski outlet-PIN akisi kaldirildi; kimlik KAPTAN uzerinden dogrulanir.
let KAPTAN = null;     // {kod, ad, pin} — bar girişi kaptan kimliği (mutfakta null)

// Bir gönderim denemesi için benzersiz kimlik. Ağ koparsa aynı kimlikle tekrar
// gönderilir; sunucu ikinci siparişi açmaz, ilkini döndürür.
function yeniSiparisId() {
  return (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(16).slice(2);
}

document.getElementById("kaptanKod").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("kaptanPin").focus(); });
document.getElementById("kaptanPin").addEventListener("keydown", e => { if (e.key === "Enter") kaptanGiris(); });

/* ================= Kullanıcı (kaptan/personel) girişi =================
   Herkes tek kullanıcı adı + PIN ile girer, sonra birim seçer:
   bar (D listesi) ya da mutfak (M listesi, bölümlü). Kimlik kişiye bağlı,
   sabit bir birime değil. */

async function kaptanGiris() {
  const err = document.getElementById("kaptanHata");
  const kod = document.getElementById("kaptanKod").value.trim();
  const pin = document.getElementById("kaptanPin").value.trim();
  if (!kod) { err.textContent = "Kullanıcı adı girin."; return; }
  if (!pin) { err.textContent = "PIN girin."; return; }
  try {
    const { data, error } = await SB.rpc("kaptan_giris", { p_kod: kod, p_pin: pin });
    // Eski DB exception atar (error dolu); yeni DB {ok:false, hata} döner.
    if (error) { err.textContent = "Kaptan veya PIN hatalı."; return; }
    if (!data || data.ok === false || !data.ad) {
      err.textContent = (data && data.hata) ? data.hata : "Kaptan veya PIN hatalı.";
      return;
    }
    KAPTAN = { kod: kod, ad: data.ad, pin: pin, departman: data.departman || "hepsi" };
    sessionStorage.setItem("gurok_kaptan_kod", kod);
    sessionStorage.setItem("gurok_kaptan_pin", pin);
    sessionStorage.setItem("gurok_kaptan_ad", data.ad);
    sessionStorage.setItem("gurok_kaptan_dep", KAPTAN.departman);
    oturumDamgala("gurok_kaptan");
    err.textContent = "";
    document.getElementById("kaptanKod").value = "";
    document.getElementById("kaptanPin").value = "";
    birimSecimGoster();
  } catch (e) { err.textContent = "Bağlantı hatası."; }
}

// Giriş sonrası birim seçim ekranı: barlar (D) + mutfaklar (M) birlikte.
function birimSecimGoster() {
  document.getElementById("kilit").style.display = "none";
  document.getElementById("bolumEkran").style.display = "none";
  document.getElementById("ana").style.display = "none";
  document.getElementById("barEkran").style.display = "";
  document.getElementById("kaptanAdEt").textContent = "Kullanıcı: " + (KAPTAN ? KAPTAN.ad : "");
  const dep = (KAPTAN && KAPTAN.departman) ? KAPTAN.departman : "hepsi";
  // Butonlar veriyi INDEKS ile taşır. Eskiden tüm outlet nesnesi (ürün listesiyle
  // birlikte, ~268 KB) onclick attribute'una JSON olarak gömülüyordu.
  const barlar = (dep === "mutfak") ? "" : D.map((o, i) =>
    '<button class="bolum-btn" data-act="bar" data-i="' + i + '">'
    + htmlEsc(kisaKod(o.c)) + ' — ' + htmlEsc(o.n) + '</button>').join("");
  const mutfaklar = (dep === "bar") ? "" : (typeof M !== "undefined" ? M : []).map((m, i) =>
    '<button class="bolum-btn" data-act="mutfak" data-i="' + i + '">'
    + htmlEsc(kisaKod(m.c)) + ' — ' + htmlEsc(m.n) + ' <span>mutfak</span></button>').join("");
  document.getElementById("barButonlar").innerHTML = barlar + mutfaklar;
}

async function barSec(o) {
  sessionStorage.setItem("gurok_birim", o.c);
  document.getElementById("barEkran").style.display = "none";
  await birimAc({ c: o.c, n: o.n, i: o.i, bl: null });
}

// Mutfak seçildi: tek bölümse direkt aç, çok bölümse bölüm ekranını göster.
function mutfakSec(m) {
  if (m.b && m.b.length === 1) { mutfakBolumAc(m, m.b[0]); }
  else { bolumSecimGoster(m); }
}

async function kaptanSifreDegistir() {
  if (!KAPTAN) return;
  const yeni = prompt("Yeni PIN (3-12 hane):");
  if (yeni === null) return;                        // iptal
  const y = yeni.trim();
  if (!/^[0-9]{3,12}$/.test(y)) { alert("PIN 3-12 haneli sayı olmalı."); return; }
  const yeni2 = prompt("Yeni PIN'i tekrar girin:");
  if (yeni2 === null) return;
  if (y !== yeni2.trim()) { alert("İki PIN aynı değil, tekrar deneyin."); return; }
  try {
    const { data, error } = await SB.rpc("kaptan_sifre_degistir",
      { p_kod: KAPTAN.kod, p_eski_pin: KAPTAN.pin, p_yeni_pin: y });
    if (error) throw error;
    const kh = rpcKimlikHatasi(data);
    if (kh) throw new Error(kh);
    KAPTAN.pin = y;
    sessionStorage.setItem("gurok_kaptan_pin", y);
    alert("Şifreniz değiştirildi.");
  } catch (e) { alert("Değiştirilemedi: " + (e.message || "hata")); }
}

function kaptanaCik() {
  KAPTAN = null;
  ["gurok_kaptan_kod", "gurok_kaptan_pin", "gurok_kaptan_ad", "gurok_kaptan_dep"].forEach(k => sessionStorage.removeItem(k));
  document.getElementById("barEkran").style.display = "none";
  document.getElementById("ana").style.display = "none";
  document.getElementById("kilit").style.display = "";
}

function bolumSecimGoster(m) {
  SECILI_MUTFAK = m;
  document.getElementById("kilit").style.display = "none";
  document.getElementById("barEkran").style.display = "none";
  document.getElementById("bolumEkran").style.display = "";
  document.getElementById("bolumBaslik").textContent = m.n;
  document.getElementById("bolumButonlar").innerHTML = m.b.map((b, i) =>
    '<button class="bolum-btn" data-act="bolum" data-i="' + i + '">' + htmlEsc(b)
    + ' <span>' + (MUTFAK_LISTE[b] ? MUTFAK_LISTE[b].length : 0) + ' kalem</span></button>').join("");
}

async function mutfakBolumAc(m, bolum) {
  const liste = MUTFAK_LISTE[bolum] || [];
  sessionStorage.setItem("gurok_birim", m.c + "|" + bolum);
  document.getElementById("bolumEkran").style.display = "none";
  await birimAc({ c: m.c, n: m.n, i: liste, bl: bolum });
}

async function birimAc(birim) {
  C = birim;
  siparisId = null;   // yeni birim = yeni sipariş denemesi
  if (!Q[anahtar()]) Q[anahtar()] = {};

  document.getElementById("kilit").style.display = "none";
  document.getElementById("bolumEkran").style.display = "none";
  document.getElementById("ana").style.display = "";
  document.getElementById("outletAd").textContent =
    kisaKod(C.c) + " — " + C.n + (C.bl ? " · " + C.bl : "");
  document.getElementById("lp").innerHTML = '<div class="em">Yükleniyor...</div>';

  /* Listeyi buluttan çek; bulut boş/erişilemezse gömülü liste kullanılır.

     Minimum sipariş miktarı (i.min) YALNIZCA bulut katalogunda var. Gömülü
     listeye düşülünce ekrandaki "en az N" etiketleri ve girişteki kırmızı
     işaret kaybolur — kullanıcı sınırı göremez. Sipariş yine reddedilir
     (siparis_gonder sunucuda "Minimum siparis miktarinin altinda" hatası
     veriyor), ama bunu gönderdikten sonra öğrenir. En azından haberi olsun. */
  const bulut = await katalogGetir(anahtar(), KAPTAN);
  if (bulut) C = { ...C, i: bulut };
  BULUT_KATALOG = !!bulut;

  GIZLI = await stokGizliYukle(KAPTAN);   // stoğu biten ürünleri gizle
  yukle();
  rl();
  us();
}

// Miktar/taslak/makbuz anahtarı: bölüm varsa ona da bağlı
function anahtar() {
  return C.c + (C.bl ? "|" + C.bl : "");
}

function barDegistir() {
  if (kirli && !confirm("Gönderilmemiş değişikliğiniz var. Yine de birim değiştirilsin mi?\n\n(Girdikleriniz bu cihazda taslak olarak saklanır.)")) {
    return;
  }
  sessionStorage.removeItem("gurok_birim");
  C = null;
  kirli = false;
  document.getElementById("ana").style.display = "none";
  // Kimlik korunur; yeniden birim seçimine dön.
  if (KAPTAN) { birimSecimGoster(); return; }
  // Kimlik yoksa girişe dön.
  kaptanaCik();
}

// Sekme oturumundan kaptanı geri yükle (sekme kapanınca silinir)
(function kaptanOturumGeriYukle() {
  const kod = sessionStorage.getItem("gurok_kaptan_kod");
  const ad  = sessionStorage.getItem("gurok_kaptan_ad");
  const pin = sessionStorage.getItem("gurok_kaptan_pin");
  const dep = sessionStorage.getItem("gurok_kaptan_dep") || "hepsi";
  if (kod && ad && pin && oturumTaze("gurok_kaptan")) {
    KAPTAN = { kod, ad, pin, departman: dep };
  } else {
    ["gurok_kaptan_kod","gurok_kaptan_pin","gurok_kaptan_ad","gurok_kaptan_dep","gurok_kaptan_zaman"]
      .forEach(k => sessionStorage.removeItem(k));   // süresi dolmuş oturum
  }
})();

// Sekme oturumunda kayıtlı birim varsa tekrar sorma (yalnız giriş yapılmışsa).
// Giriş yoksa kilit ekranı açık kalır; birim otomatik açılmaz.
const kayitliBirim = sessionStorage.getItem("gurok_birim");
if (kayitliBirim && KAPTAN) {
  const [kod, bolum] = kayitliBirim.split("|");
  if (bolum) {
    const m = M.find(x => x.c === kod);
    if (m) mutfakBolumAc(m, bolum);
  } else {
    const o = D.find(x => x.c === kod);
    if (o) birimAc({ c: o.c, n: o.n, i: o.i, bl: null });
  }
}
if (!C) document.getElementById("kaptanKod").focus();

/* ================= Taslak (yerel) =================
   3408 kalemlik listede 40 kalem girip telefon kilitlenirse emek gitmesin diye
   her değişiklik tarayıcıya yazılır. Sunucudaki gönderim daha yeniyse o kazanır. */

function taslakAnahtar(kod) { return "gurok_taslak_" + kod; }

function taslakYaz() {
  if (!C) return;
  try {
    localStorage.setItem(taslakAnahtar(anahtar()), JSON.stringify({
      tarih: bugun(), ts: Date.now(), q: Q[anahtar()] || {}
    }));
  } catch (e) { /* depolama dolu/kapalı — akışı bozmaz */ }
}

function taslakOku(kod) {
  try {
    const t = JSON.parse(localStorage.getItem(taslakAnahtar(kod)) || "null");
    return (t && t.tarih === bugun()) ? t : null;   // dünün taslağı kullanılmaz
  } catch (e) { return null; }
}

function taslakSil(kod) {
  try { localStorage.removeItem(taslakAnahtar(kod)); } catch (e) {}
}

/* ================= Açılış =================
   Her gönderim ayrı bir sipariştir; gönderilen sipariş depoda kalır, bar ekranı
   sıfırlanır. Bu yüzden burada sunucudan bir şey çekilmez — sadece henüz
   gönderilmemiş yerel taslak varsa geri yüklenir. */

function yukle() {
  Q[anahtar()] = {};
  kirli = false;

  const taslak = taslakOku(anahtar());
  if (taslak && Object.keys(taslak.q).length) {
    const temiz = miktarHaritasiTemizle(taslak.q);
    // Taslak dünden kalmış olabilir; o gün stokta olan ürün bugün bitmiş olabilir.
    // Bunları sessizce düşürmek yerine kullanıcıya söyle (aksi hâlde gönderdiğini
    // sandığı kalem listede yok diye kaybolur).
    const dusen = Object.keys(temiz).filter(k => GIZLI.has(k));
    dusen.forEach(k => { delete temiz[k]; });
    Q[anahtar()] = temiz;
    kirli = true;
    durum("hata", "⚠ Gönderilmemiş taslağınız var"
      + (dusen.length ? ` — stokta olmayan ${dusen.length} kalem çıkarıldı` : ""));
  } else {
    durum("yok", "Yeni sipariş");
  }
  makbuzCiz();
}

/* ================= Gönderim makbuzu =================
   Bar gönderdikten sonra listesi sıfırlanır; ne gönderdiğini unutmaması için
   o günkü gönderimlerinin numarası ve saati bu cihazda tutulur. */

function makbuzAnahtar(kod) { return "gurok_makbuz_" + kod; }

function makbuzOku(kod) {
  try {
    const m = JSON.parse(localStorage.getItem(makbuzAnahtar(kod)) || "null");
    return (m && m.tarih === bugun()) ? m.liste : [];
  } catch (e) { return []; }
}

function makbuzEkle(kod, kayit) {
  const liste = makbuzOku(kod);
  liste.unshift(kayit);
  try {
    localStorage.setItem(makbuzAnahtar(kod), JSON.stringify({ tarih: bugun(), liste }));
  } catch (e) {}
}

/* Gönderim listesi SUNUCUDAN gelir: başka kaptanın gönderdiği sipariş de görünür ve
   durumu (bekliyor/onaylandı) doğru bilinir. Sunucuya ulaşılamazsa yerel makbuza düşer.
   Bekleyen siparişlerde geri çağırma (düzelt / iptal) butonları açılır. */
let BEKLEYEN = null;   // sunucudan gelen liste (null = alınamadı)

async function makbuzCiz() {
  const kutu = document.getElementById("makbuz");
  const yerel = makbuzOku(anahtar());

  BEKLEYEN = null;
  if (C && KAPTAN) {
    try {
      const { data, error } = await SB.rpc("bekleyen_siparisler", {
        p_outlet_kod: C.c, p_bolum: C.bl, p_kaptan_kod: KAPTAN.kod, p_kaptan_pin: KAPTAN.pin });
      if (error) throw error;
      // Kimlik hatası dizi değil {ok:false} döner — sessizce "çevrimdışı" sanılmasın.
      const kh = rpcKimlikHatasi(data);
      if (kh) throw new Error(kh);
      if (Array.isArray(data)) BEKLEYEN = data;
    } catch (e) {
      console.error("bekleyen_siparisler:", e.message || e);  // çevrimdışı → yerel makbuz
    }
  }

  const liste = BEKLEYEN || yerel.map(x => ({ siparis_no: x.no, saat: x.saat, kalem: x.kalem }));
  if (!liste.length) { kutu.style.display = "none"; return; }

  kutu.style.display = "";
  document.getElementById("makbuzListe").innerHTML = liste.map(x => {
    const bekliyor = x.durum === "talep";
    const onayli = x.durum === "onaylandi";
    const rozet = x.durum === "iptal"
                    ? '<span class="mk-iptal">🚫 İptal'
                      + (x.iptal_eden ? ' · ' + htmlEsc(x.iptal_eden) : "") + '</span>'
                : x.durum === "onaylandi" ? '<span class="mk-ok">✓ Onaylandı</span>'
                : bekliyor                ? '<span class="mk-bek">⏳ Bekliyor</span>' : "";
    const butonlar = bekliyor
      ? '<div class="mk-btn">'
        + '<button class="cb" data-act="duzelt" data-no="' + htmlEsc(x.siparis_no) + '">↩ Düzelt</button>'
        + '<button class="cb" data-act="iptal"  data-no="' + htmlEsc(x.siparis_no) + '">🗑 İptal</button>'
        + '</div>' : "";
    return '<div class="makbuz-sat"><b>' + htmlEsc(x.siparis_no) + '</b>'
      + '<span>' + htmlEsc(x.saat || "") + ' — ' + (x.kalem || 0) + ' kalem'
      + (x.gonderen ? ' · 👤 ' + htmlEsc(x.gonderen) : "") + '</span>'
      + rozet + teslimRozeti(x)
      + (onayli ? '<div class="mk-btn">'
          + '<button class="cb" data-act="never" data-no="' + htmlEsc(x.siparis_no) + '">'
          + (ACIK_TESLIM === x.siparis_no ? '▲ Kapat' : '👁 Ne verildi?') + '</button></div>' : "")
      + butonlar + teslimDetayHtml(x) + '</div>';
  }).join("");
}

/* Teslim mutabakatı: depo onayladıktan sonra kaptan ne verildiğini görür,
   teslim aldığını onaylar ya da itiraz eder. Stok/Excel/tüketim etkilenmez. */
let ACIK_TESLIM = null;   // detayı açık siparişin numarası

function teslimRozeti(x) {
  if (x.teslim_durum === "alindi")
    return '<span class="mk-teslim">✓ Teslim alındı'
         + (x.teslim_eden ? ' · ' + htmlEsc(x.teslim_eden) : "") + '</span>';
  if (x.teslim_durum === "itiraz")
    return '<span class="mk-itiraz">⚠ İtiraz'
         + (x.teslim_not ? ' · ' + htmlEsc(x.teslim_not) : "") + '</span>';
  return "";
}

// Onaylanan siparişin kalem karşılaştırması: istenen → verilen
function teslimDetayHtml(x) {
  if (ACIK_TESLIM !== x.siparis_no || !Array.isArray(x.kalemler)) return "";
  let h = '<table class="tsl-tbl"><thead><tr><th>ÜRÜN</th><th>İSTENEN</th><th>VERİLEN</th></tr></thead><tbody>';
  x.kalemler.forEach(el => {
    const istenen = Number(el.m) || 0;
    const verilen = (el.o === undefined || el.o === null) ? istenen : Number(el.o);
    const fark = verilen !== istenen;
    h += '<tr' + (fark ? ' class="tsl-fark"' : '') + '>'
       + '<td>' + htmlEsc(el.a || el.k) + '</td>'
       + '<td class="say">' + istenen + '</td>'
       + '<td class="say">' + (verilen > 0 ? verilen : "verilmedi")
       + (fark ? ' ⚠' : '') + '</td></tr>';
  });
  h += '</tbody></table>';
  if (!x.teslim_durum) {
    h += '<div class="mk-btn">'
       + '<button class="cb" data-act="teslim-ok" data-no="' + htmlEsc(x.siparis_no) + '">✓ Teslim aldım</button>'
       + '<button class="cb" data-act="teslim-red" data-no="' + htmlEsc(x.siparis_no) + '">⚠ Eksik/Yanlış</button>'
       + '</div>';
  }
  return '<div class="tsl-detay">' + h + '</div>';
}

function teslimDetayAc(no) {
  ACIK_TESLIM = (ACIK_TESLIM === no) ? null : no;
  makbuzCiz();
}

async function siparisTeslim(no, durum) {
  if (!KAPTAN) return;
  let not = null;
  if (durum === "itiraz") {
    not = prompt("Sorun nedir? (kısaca)\n\nÖrn: 2 koli su eksik geldi");
    if (not === null) return;                 // iptal
  } else if (!confirm(no + " teslim alındı olarak işaretlenecek. Devam?")) return;
  try {
    const { data, error } = await SB.rpc("siparis_teslim", {
      p_siparis_no: no, p_durum: durum, p_not: not,
      p_kaptan_kod: KAPTAN.kod, p_kaptan_pin: KAPTAN.pin });
    if (error) throw error;
    const kh = rpcKimlikHatasi(data);
    if (kh) throw new Error(kh);
    ACIK_TESLIM = null;
    await makbuzCiz();
  } catch (e) {
    console.error(e);
    alert("Kaydedilemedi: " + (e.message || "bağlantı hatası"));
  }
}

/* Geri çağırma: sunucu siparişi iptal eder ve kalemlerini döndürür.
   duzelt=true ise kalemler ekrana geri yüklenir (baştan girilmesin). */
async function siparisGeriCagir(no, duzelt) {
  if (!KAPTAN) return;
  const soru = duzelt
    ? no + " geri çağrılacak ve kalemleri ekrana yüklenecek.\n\nDüzeltip yeniden göndermeniz gerekir. Devam?"
    : no + " İPTAL EDİLECEK.\n\nDepoya gitmez. Devam?";
  if (!confirm(soru)) return;
  try {
    const { data, error } = await SB.rpc("siparis_geri_cagir",
      { p_siparis_no: no, p_kaptan_kod: KAPTAN.kod, p_kaptan_pin: KAPTAN.pin });
    if (error) throw error;
    const kh = rpcKimlikHatasi(data);
    if (kh) throw new Error(kh);

    makbuzSil(anahtar(), no);        // yerel makbuzdan da düş
    if (duzelt && data && Array.isArray(data.kalemler)) {
      /* Ekrana KAPTANIN KENDİ talebi (el.m) geri yüklenir, deponun düşürdüğü
         miktar (el.o) DEĞİL.

         Geri çağırma yalnız 'talep' durumunda mümkün (siparis_geri_cagir
         atomik update'i), depo ise 'talep' aşamasında da miktar düşürebiliyor
         (depo_kalem_guncelle yalnız 'onaylandi'/'iptal' engelliyor). Eskiden
         el.o varsa o tercih ediliyordu: kaptan Düzelt'e bastığında ekrana
         deponun düşürdüğü miktar geliyor, yeniden gönderince talebi sessizce
         küçülüyordu.

         Deponun önerisi yok sayılmaz ama kaptanın yerine karar vermez —
         kaç kalemde farklı miktar önerildiği bildirilir. */
      const q = {};
      const depoFarki = [];
      data.kalemler.forEach(el => {
        const istenen = Number(el.m);
        if (!el.k || !(istenen > 0)) return;
        q[el.k] = istenen;
        const depo = (el.o === undefined || el.o === null) ? null : Number(el.o);
        if (depo !== null && depo !== istenen) {
          depoFarki.push((el.a || el.k) + ": " + istenen + " → " + depo);
        }
      });
      Q[anahtar()] = miktarHaritasiTemizle(q);
      kirli = true;
      taslakYaz();
      rl(); us();
      durum("hata", "⚠ " + no + " geri çağrıldı — düzeltip yeniden gönderin"
        + (depoFarki.length ? ` (depo ${depoFarki.length} kalemde farklı miktar önermişti)` : ""));
      if (depoFarki.length) {
        alert("Kendi talebiniz ekrana yüklendi.\n\nDepo şu kalemlerde farklı miktar "
          + "önermişti:\n\n" + depoFarki.join("\n")
          + "\n\nGerekiyorsa elle düzeltip gönderin.");
      }
    } else {
      durum("yok", no + " iptal edildi");
    }
    await makbuzCiz();
  } catch (e) {
    console.error(e);
    alert("Geri çağrılamadı: " + (e.message || "bağlantı hatası"));
    await makbuzCiz();
  }
}

// Yerel makbuz kaydından bir siparişi düşür (iptal sonrası)
function makbuzSil(kod, no) {
  try {
    const liste = makbuzOku(kod).filter(x => x.no !== no);
    localStorage.setItem(makbuzAnahtar(kod), JSON.stringify({ tarih: bugun(), liste }));
  } catch (e) {}
}

function durum(sinif, metin) {
  const d = document.getElementById("durum");
  d.className = "dz " + sinif;
  d.textContent = metin;
}

/* ================= Liste render ================= */

function rl() {
  const p = document.getElementById("lp");
  if (!C) { p.innerHTML = '<div class="em">Bar kodunuzu girin</div>'; return; }

  // Stoğu biten ürünler listede görünmez. Stok bilgisi olmayan (GIZLI'de
  // bulunmayan) ürün normal görünür — mutfak kalemleri kaybolmaz.
  const gorunur = C.i.filter(i => !GIZLI.has(i.k));

  let h = '<input class="sb" placeholder="Ürün ara..." oninput="fi(this.value)">'
        + '<div class="ib"><span>' + htmlEsc(C.c) + ' — ' + htmlEsc(C.n) + '</span>'
        + '<span class="bg">' + gorunur.length + ' kalem</span></div>';

  // Her grup tek blok. Bar listeleri GC sırasına, mutfak listeleri kategori
  // sırasına göre dizilir (bkz. ortak.js / mutfak.js).
  const mutfakMi = !!C.bl;
  const bloklar = mutfakMi ? grupla(gorunur, mutfakKatIndex) : grupla(gorunur);

  bloklar.forEach(([g, items]) => {
    if (g) {
      h += '<div class="gh ' + (mutfakMi ? mutfakKatSinifi(g) : grupSinifi(g)) + '">' + htmlEsc(g)
         + ' <span class="gs">' + items.length + '</span></div>';
    }
    items.forEach(i => {
      const q = Q[anahtar()]?.[i.k] || "";
      h += '<div class="ir' + (q ? " hq" : "") + '"'
         + ' data-n="' + htmlEsc(i.a.toLowerCase()) + '" data-c="' + htmlEsc(i.k.toLowerCase()) + '">'
         + '<span class="ic">' + htmlEsc(i.k) + '</span>'
         + '<span class="in">' + htmlEsc(i.a)
         + (i.min ? ' <span class="minlbl">en az ' + i.min + '</span>' : '') + '</span>'
         + '<span class="iu">' + htmlEsc(i.b) + '</span>'
         + '<span class="iq"><input type="number" min="0" value="' + htmlEsc(q || "") + '"'
         + ' class="' + (q ? "fl" : "") + (q && i.min && q < Number(i.min) ? " eksik" : "") + '"'
         + (i.min ? ' title="En az ' + i.min + ' girilmeli"' : "")
         + ' data-k="' + htmlEsc(i.k) + '"'
         + ' onchange="sq(this)" onfocus="this.select()"></span></div>';
    });
  });
  p.innerHTML = h;
}

function fi(t) {
  t = t.toLowerCase();
  document.querySelectorAll(".ir").forEach(r => {
    r.style.display = (r.dataset.n.includes(t) || r.dataset.c.includes(t)) ? "" : "none";
  });
  document.querySelectorAll(".gh").forEach(g => {
    let n = g.nextElementSibling, v = false;
    while (n && !n.classList.contains("gh")) {
      if (n.style.display !== "none") v = true;
      n = n.nextElementSibling;
    }
    g.style.display = v ? "" : "none";
  });
}

// Ürünün minimum sipariş miktarı (global; katalog_getir'den gelir). Yoksa 0.
function urunMin(k) {
  const it = C && C.i.find(i => i.k === k);
  return it && it.min ? Number(it.min) : 0;
}

function sq(inp) {
  const k = inp.dataset.k, v = parseInt(inp.value) || 0;
  if (!Q[anahtar()]) Q[anahtar()] = {};
  if (v > 0) {
    Q[anahtar()][k] = v;
    inp.classList.add("fl");
    inp.closest(".ir").classList.add("hq");
  } else {
    delete Q[anahtar()][k];
    inp.classList.remove("fl");
    inp.closest(".ir").classList.remove("hq");
    inp.value = "";
  }
  minIsaretle(inp, k, v);
  kirli = true;
  taslakYaz();
  us();
}

// Girilen miktar minimumun altındaysa input'u kırmızı işaretle.
function minIsaretle(inp, k, v) {
  const min = urunMin(k);
  if (v > 0 && min > 0 && v < min) {
    inp.classList.add("eksik");
    inp.title = "En az " + min + " girilmeli";
  } else {
    inp.classList.remove("eksik");
    inp.title = "";
  }
}

// Minimumun altında kalan seçili kalemler
function minEksikler() {
  return seciliKalemler().filter(x => { const m = urunMin(x.k); return m > 0 && x.m < m; })
    .map(x => ({ k: x.k, a: x.a, m: x.m, min: urunMin(x.k) }));
}

function us() {
  const tb = document.getElementById("stb"),
        ct = document.getElementById("cnt"),
        g  = document.getElementById("gb");

  if (!C) { tb.innerHTML = ""; ct.textContent = "0"; g.disabled = true; return; }

  // Özet, gönderim ve Excel hep aynı sırayı kullansın diye tek kaynaktan
  const items = seciliKalemler();
  ct.textContent = items.length;
  g.disabled = items.length === 0;

  // Minimum altında kalan varsa gönderim kapalı, uyarı göster
  const eksik = minEksikler();
  if (eksik.length) {
    g.disabled = true;
    durum("hata", "⚠ " + eksik.length + " üründe en az miktarın altında — düzeltin");
  } else if (kirli && items.length) {
    // Girilmiş ama gönderilmemiş miktar varsa rozet bunu hatırlatsın
    durum("hata", "⚠ " + items.length + " kalem girildi — henüz gönderilmedi");
  }
  tb.innerHTML = items.map(i =>
    '<tr><td style="font-family:monospace;font-size:10px">' + htmlEsc(i.k) + '</td>'
    + '<td>' + htmlEsc(i.a) + '</td>'
    + '<td style="text-align:center;font-weight:700">' + i.m + '</td>'
    + '<td style="text-align:center">' + htmlEsc(i.b) + '</td></tr>').join("");
}

function clr() {
  if (!C) return;
  if (!confirm("Bu outlet için girilen tüm miktarlar silinecek. Emin misiniz?")) return;
  Q[anahtar()] = {};
  kirli = true;
  taslakYaz();
  rl();
  us();
}

/* ================= Sipariş gönderimi ================= */

// Ekranda görülen sırayla döner; Excel satır sırası da bu olur.
//
// GIZLI süzgeci burada da ŞART. rl() yalnızca ÇİZİMİ süzüyordu; bu fonksiyon ham
// C.i üzerinden çalıştığı için stoğu biten bir ürün ekranda görünmediği hâlde
// özete ve gönderilen siparişe giriyordu. Taslaklar localStorage'da kalıcı
// olduğundan (taslakYaz) dün miktar girilmiş bir ürün bugün stoğu bitse bile
// sessizce sipariş edilebiliyordu.
function seciliKalemler() {
  if (!C) return [];
  const q = Q[anahtar()] || {};
  const secilen = C.i.filter(i => q[i.k] && !GIZLI.has(i.k));
  // Ekranda hangi sırayla görünüyorsa Excel'e de o sırayla gider.
  return grupluSirala(secilen, C.bl ? mutfakKatIndex : undefined)
    .map(i => ({ k: i.k, a: i.a, b: i.b, g: i.g, m: q[i.k] }));
}

async function gonder() {
  if (!C) return;
  const kalemler = seciliKalemler();
  if (!kalemler.length) return;

  // Minimum sipariş miktarı denetimi — altında kalan varsa gönderme, düzelttir.
  const eksik = minEksikler();
  if (eksik.length) {
    alert("Şu ürünlerde en az sipariş miktarının ALTINDA:\n\n"
      + eksik.map(x => "• " + x.a + ": en az " + x.min + " (girilen: " + x.m + ")").join("\n")
      + "\n\nLütfen düzeltip tekrar gönderin.");
    return;
  }

  if (!confirm(kalemler.length + " kalemlik sipariş depoya gönderilecek.\n\n"
             + (BULUT_KATALOG ? "" : "⚠ Güncel katalog yüklenemedi; minimum sipariş\n"
                 + "sınırları ekranda gösterilemiyor. Sınırın altındaki kalem\n"
                 + "varsa sunucu siparişi reddedecektir.\n\n")
             + "Gönderdikten sonra listeniz sıfırlanır, sipariş depoda kalır.\n"
             + "Gün içinde istediğiniz kadar yeni sipariş gönderebilirsiniz.\n\nGönderilsin mi?")) {
    return;
  }

  const b = document.getElementById("gb");
  b.disabled = true;
  b.textContent = "⏳ Gönderiliyor...";

  // Aynı denemenin tekrarı aynı kimliği taşısın; yeni deneme yeni kimlik alır.
  if (!siparisId) siparisId = yeniSiparisId();

  try {
    const { data, error } = await SB.rpc("siparis_gonder", {
      p_outlet_kod: C.c, p_outlet_ad: C.n, p_kalemler: kalemler,
      p_bolum: C.bl, p_istemci_id: siparisId,
      p_kaptan_kod: KAPTAN ? KAPTAN.kod : null,
      p_kaptan_pin: KAPTAN ? KAPTAN.pin : null
    });
    if (error) throw error;
    const kh = rpcKimlikHatasi(data);
    if (kh) throw new Error(kh);

    // Gönderim başarılı: makbuza yaz, ekranı sıfırla
    makbuzEkle(anahtar(), { no: data.siparis_no, saat: data.saat, kalem: data.kalem });
    siparisId = null;   // başarılı: sonraki sipariş yeni kimlik alsın
    Q[anahtar()] = {};
    kirli = false;
    taslakSil(anahtar());
    rl();
    us();
    makbuzCiz();

    b.textContent = "✅ Gönderildi";
    b.classList.add("ok");
    durum("var", "✓ " + data.siparis_no + " gönderildi — " + data.kalem + " kalem, " + data.saat);
    setTimeout(() => {
      b.textContent = "📤 Siparişi Gönder";
      b.classList.remove("ok");
      b.disabled = false;
    }, 3000);

  } catch (e) {
    console.error(e);
    b.textContent = "❌ Gönderilemedi";
    durum("hata", "⚠ Gönderilemedi — internet bağlantınızı kontrol edin, tekrar deneyin");
    setTimeout(() => { b.textContent = "📤 Siparişi Gönder"; b.disabled = false; }, 3000);
  }
}

/* Gönderilmemiş değişiklikle sayfadan çıkışta uyar */
window.addEventListener("beforeunload", e => {
  if (kirli) { e.preventDefault(); e.returnValue = ""; }
});
/* ---- Olay delegasyonu ----
   Buton verisi data-* ile indeks olarak taşınır; nesneler onclick attribute'una
   gömülmez (DOM şişmesi + apostroflu adlarda bozulma riski). */
let SECILI_MUTFAK = null;   // bölüm ekranındaki mutfak
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const i = Number(t.dataset.i);
  if (t.dataset.act === "never")       { teslimDetayAc(t.dataset.no);            return; }
  if (t.dataset.act === "teslim-ok")   { siparisTeslim(t.dataset.no, "alindi");  return; }
  if (t.dataset.act === "teslim-red")  { siparisTeslim(t.dataset.no, "itiraz");  return; }
  if (t.dataset.act === "duzelt")      { siparisGeriCagir(t.dataset.no, true);  return; }
  if (t.dataset.act === "iptal")       { siparisGeriCagir(t.dataset.no, false); return; }
  if (t.dataset.act === "bar")         barSec(D[i]);
  else if (t.dataset.act === "mutfak") mutfakSec(M[i]);
  else if (t.dataset.act === "bolum" && SECILI_MUTFAK)
    mutfakBolumAc(SECILI_MUTFAK, SECILI_MUTFAK.b[i]);
});
</script>
