<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Sipariş Girişi — GUROK</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>

<!-- ===== Kod giriş ekranı ===== -->
<div class="kilit" id="kilit">
  <h2>SİPARİŞ GİRİŞİ</h2>
  <p>Kodunuzu girin<br><small>bar için <b>315</b> · mutfak için <b>M201</b></small></p>
  <input type="text" id="kod" placeholder="315 veya M201" autocomplete="off" maxlength="6">
  <button id="girisBtn" onclick="girisYap()">Devam</button>
  <div class="err" id="kodHata"></div>
</div>

<!-- ===== Bölüm seçim ekranı (çok bölümlü mutfaklar) ===== -->
<div class="kilit" id="bolumEkran" style="display:none">
  <h2 id="bolumBaslik">MUTFAK</h2>
  <p>Bölümünüzü seçin</p>
  <div id="bolumButonlar"></div>
  <button class="cb" style="margin-top:14px" onclick="kodaDon()">← Kod ekranına dön</button>
</div>

<!-- ===== Ana ekran ===== -->
<div id="ana" style="display:none">
<div class="hdr">
  <h1>SİPARİŞ GİRİŞİ</h1>
  <div class="hr">
    <span class="outlet-ad" id="outletAd">—</span>
    <button class="cb" style="display:inline-block;width:auto;margin:0;padding:8px 14px" onclick="barDegistir()">↔ Birim Değiştir</button>
    <span class="dz yok" id="durum">—</span>
    <button class="gb" id="gb" disabled onclick="gonder()">📤 Siparişi Gönder</button>
  </div>
</div>

<div class="mn">
  <div class="lp" id="lp"><div class="em">Yükleniyor...</div></div>
  <div class="sp">
    <div class="st">ÖZET RAPOR</div>
    <div class="sc">Kalem: <span id="cnt">0</span></div>
    <table class="tb">
      <thead><tr><th>KOD</th><th>AD</th><th>MİKTAR</th><th>BİRİM</th></tr></thead>
      <tbody id="stb"></tbody>
    </table>
    <button class="cb" onclick="clr()">Tümünü Temizle</button>

    <div class="makbuz" id="makbuz" style="display:none">
      <div class="makbuz-bas">BUGÜN GÖNDERDİKLERİNİZ</div>
      <div id="makbuzListe"></div>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="veri.js"></script>
<script src="mutfak.js"></script>
<script src="config.js"></script>
<script src="ortak.js"></script>
<script>
/* ================= Durum ================= */

let Q = {};         // outletKod -> {kalemKod: miktar}
let C = null;       // seçili outlet
let kirli = false;  // gönderilmemiş değişiklik var mı

/* ================= Kod ile giriş =================
   Bar   : CSM315 → "315"   (üç hane)
   Mutfak: CMM201 → "M201"  (M + üç hane)

   Bar 201 ile mutfak 201 çakışmasın diye mutfaklar M ile ayrılır. Tam kod
   (CSM315 / CMM201) da kabul edilir.

   Bu bir kilit DEĞİLDİR — kodlar tahmin edilebilir. Amacı personeli doğru
   birime yönlendirmek ve yanlış yere sipariş girilmesini önlemek. */

function girisCoz(girilen) {
  const t = String(girilen || "").trim().toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (!t) return null;

  const mutfak = kod => M.find(m => m.c === kod) || null;
  const bar    = kod => D.find(o => o.c === kod) || null;

  let x;
  if (/^CMM\d{3}$/.test(t) && (x = mutfak(t)))            return { tip: "mutfak", m: x };
  if (/^M\d{3}$/.test(t)   && (x = mutfak("CMM" + t.slice(1)))) return { tip: "mutfak", m: x };
  if (/^CSM\d{3}$/.test(t) && (x = bar(t)))               return { tip: "bar", o: x };
  if (/^\d{3}$/.test(t)    && (x = bar("CSM" + t)))       return { tip: "bar", o: x };
  return null;
}

const kodInput = document.getElementById("kod");
kodInput.addEventListener("keydown", e => { if (e.key === "Enter") girisYap(); });

async function girisYap() {
  const err = document.getElementById("kodHata");
  const c = girisCoz(kodInput.value);

  if (!c) {
    err.textContent = "Bu kodla bir birim bulunamadı. Bar: 315 · Mutfak: M201";
    kodInput.select();
    return;
  }

  err.textContent = "";

  if (c.tip === "bar") {
    sessionStorage.setItem("gurok_birim", c.o.c);
    await birimAc({ c: c.o.c, n: c.o.n, i: c.o.i, bl: null });
    return;
  }

  // Tek bölümlü mutfak doğrudan açılır, çok bölümlü seçim ister
  if (c.m.b.length === 1) {
    await mutfakBolumAc(c.m, c.m.b[0]);
  } else {
    bolumSecimGoster(c.m);
  }
}

function bolumSecimGoster(m) {
  document.getElementById("kilit").style.display = "none";
  document.getElementById("bolumEkran").style.display = "";
  document.getElementById("bolumBaslik").textContent = m.n;
  document.getElementById("bolumButonlar").innerHTML = m.b.map(b =>
    '<button class="bolum-btn" onclick="mutfakBolumAc(' + JSON.stringify(m).replace(/"/g, "&quot;")
    + ', \'' + b + '\')">' + htmlEsc(b)
    + ' <span>' + (MUTFAK_LISTE[b] ? MUTFAK_LISTE[b].length : 0) + ' kalem</span></button>').join("");
}

async function mutfakBolumAc(m, bolum) {
  const liste = MUTFAK_LISTE[bolum] || [];
  sessionStorage.setItem("gurok_birim", m.c + "|" + bolum);
  document.getElementById("bolumEkran").style.display = "none";
  await birimAc({ c: m.c, n: m.n, i: liste, bl: bolum });
}

async function birimAc(birim) {
  C = birim;
  if (!Q[anahtar()]) Q[anahtar()] = {};

  document.getElementById("kilit").style.display = "none";
  document.getElementById("bolumEkran").style.display = "none";
  document.getElementById("ana").style.display = "";
  document.getElementById("outletAd").textContent =
    kisaKod(C.c) + " — " + C.n + (C.bl ? " · " + C.bl : "");

  yukle();
  rl();
  us();
}

// Miktar/taslak/makbuz anahtarı: bölüm varsa ona da bağlı
function anahtar() {
  return C.c + (C.bl ? "|" + C.bl : "");
}

function kodaDon() {
  document.getElementById("bolumEkran").style.display = "none";
  document.getElementById("kilit").style.display = "";
  kodInput.value = "";
  kodInput.focus();
}

function barDegistir() {
  if (kirli && !confirm("Gönderilmemiş değişikliğiniz var. Yine de birim değiştirilsin mi?\n\n(Girdikleriniz bu cihazda taslak olarak saklanır.)")) {
    return;
  }
  sessionStorage.removeItem("gurok_birim");
  C = null;
  kirli = false;
  document.getElementById("ana").style.display = "none";
  document.getElementById("kilit").style.display = "";
  kodInput.value = "";
  document.getElementById("kodHata").textContent = "";
  kodInput.focus();
}

// Sekme oturumunda kayıtlı birim varsa tekrar sorma (sekme kapanınca silinir)
const kayitliBirim = sessionStorage.getItem("gurok_birim");
if (kayitliBirim) {
  const [kod, bolum] = kayitliBirim.split("|");
  if (bolum) {
    const m = M.find(x => x.c === kod);
    if (m) mutfakBolumAc(m, bolum);
  } else {
    const o = D.find(x => x.c === kod);
    if (o) birimAc({ c: o.c, n: o.n, i: o.i, bl: null });
  }
}
if (!C) kodInput.focus();

/* ================= Taslak (yerel) =================
   3408 kalemlik listede 40 kalem girip telefon kilitlenirse emek gitmesin diye
   her değişiklik tarayıcıya yazılır. Sunucudaki gönderim daha yeniyse o kazanır. */

function taslakAnahtar(kod) { return "gurok_taslak_" + kod; }

function taslakYaz() {
  if (!C) return;
  try {
    localStorage.setItem(taslakAnahtar(anahtar()), JSON.stringify({
      tarih: bugun(), ts: Date.now(), q: Q[anahtar()] || {}
    }));
  } catch (e) { /* depolama dolu/kapalı — akışı bozmaz */ }
}

function taslakOku(kod) {
  try {
    const t = JSON.parse(localStorage.getItem(taslakAnahtar(kod)) || "null");
    return (t && t.tarih === bugun()) ? t : null;   // dünün taslağı kullanılmaz
  } catch (e) { return null; }
}

function taslakSil(kod) {
  try { localStorage.removeItem(taslakAnahtar(kod)); } catch (e) {}
}

/* ================= Açılış =================
   Her gönderim ayrı bir sipariştir; gönderilen sipariş depoda kalır, bar ekranı
   sıfırlanır. Bu yüzden burada sunucudan bir şey çekilmez — sadece henüz
   gönderilmemiş yerel taslak varsa geri yüklenir. */

function yukle() {
  Q[anahtar()] = {};
  kirli = false;

  const taslak = taslakOku(anahtar());
  if (taslak && Object.keys(taslak.q).length) {
    Q[anahtar()] = taslak.q;
    kirli = true;
    durum("hata", "⚠ Gönderilmemiş taslağınız var");
  } else {
    durum("yok", "Yeni sipariş");
  }
  makbuzCiz();
}

/* ================= Gönderim makbuzu =================
   Bar gönderdikten sonra listesi sıfırlanır; ne gönderdiğini unutmaması için
   o günkü gönderimlerinin numarası ve saati bu cihazda tutulur. */

function makbuzAnahtar(kod) { return "gurok_makbuz_" + kod; }

function makbuzOku(kod) {
  try {
    const m = JSON.parse(localStorage.getItem(makbuzAnahtar(kod)) || "null");
    return (m && m.tarih === bugun()) ? m.liste : [];
  } catch (e) { return []; }
}

function makbuzEkle(kod, kayit) {
  const liste = makbuzOku(kod);
  liste.unshift(kayit);
  try {
    localStorage.setItem(makbuzAnahtar(kod), JSON.stringify({ tarih: bugun(), liste }));
  } catch (e) {}
}

function makbuzCiz() {
  const kutu = document.getElementById("makbuz");
  const liste = makbuzOku(anahtar());
  if (!liste.length) { kutu.style.display = "none"; return; }

  kutu.style.display = "";
  document.getElementById("makbuzListe").innerHTML = liste.map(x =>
    '<div class="makbuz-sat"><b>' + htmlEsc(x.no) + '</b>'
    + '<span>' + htmlEsc(x.saat) + ' — ' + x.kalem + ' kalem</span></div>').join("");
}

function durum(sinif, metin) {
  const d = document.getElementById("durum");
  d.className = "dz " + sinif;
  d.textContent = metin;
}

/* ================= Liste render ================= */

function rl() {
  const p = document.getElementById("lp");
  if (!C) { p.innerHTML = '<div class="em">Bar kodunuzu girin</div>'; return; }

  let h = '<input class="sb" placeholder="Ürün ara..." oninput="fi(this.value)">'
        + '<div class="ib"><span>' + htmlEsc(C.c) + ' — ' + htmlEsc(C.n) + '</span>'
        + '<span class="bg">' + C.i.length + ' kalem</span></div>';

  // Her grup tek blok. Bar listeleri GC sırasına, mutfak listeleri kategori
  // sırasına göre dizilir (bkz. ortak.js / mutfak.js).
  const mutfakMi = !!C.bl;
  const bloklar = mutfakMi ? grupla(C.i, mutfakKatIndex) : grupla(C.i);

  bloklar.forEach(([g, items]) => {
    if (g) {
      h += '<div class="gh ' + (mutfakMi ? mutfakKatSinifi(g) : grupSinifi(g)) + '">' + htmlEsc(g)
         + ' <span class="gs">' + items.length + '</span></div>';
    }
    items.forEach(i => {
      const q = Q[anahtar()]?.[i.k] || "";
      h += '<div class="ir' + (q ? " hq" : "") + '"'
         + ' data-n="' + htmlEsc(i.a.toLowerCase()) + '" data-c="' + htmlEsc(i.k.toLowerCase()) + '">'
         + '<span class="ic">' + htmlEsc(i.k) + '</span>'
         + '<span class="in">' + htmlEsc(i.a) + '</span>'
         + '<span class="iu">' + htmlEsc(i.b) + '</span>'
         + '<span class="iq"><input type="number" min="0" value="' + (q || "") + '"'
         + ' class="' + (q ? "fl" : "") + '" data-k="' + htmlEsc(i.k) + '"'
         + ' onchange="sq(this)" onfocus="this.select()"></span></div>';
    });
  });
  p.innerHTML = h;
}

function fi(t) {
  t = t.toLowerCase();
  document.querySelectorAll(".ir").forEach(r => {
    r.style.display = (r.dataset.n.includes(t) || r.dataset.c.includes(t)) ? "" : "none";
  });
  document.querySelectorAll(".gh").forEach(g => {
    let n = g.nextElementSibling, v = false;
    while (n && !n.classList.contains("gh")) {
      if (n.style.display !== "none") v = true;
      n = n.nextElementSibling;
    }
    g.style.display = v ? "" : "none";
  });
}

function sq(inp) {
  const k = inp.dataset.k, v = parseInt(inp.value) || 0;
  if (!Q[anahtar()]) Q[anahtar()] = {};
  if (v > 0) {
    Q[anahtar()][k] = v;
    inp.classList.add("fl");
    inp.closest(".ir").classList.add("hq");
  } else {
    delete Q[anahtar()][k];
    inp.classList.remove("fl");
    inp.closest(".ir").classList.remove("hq");
    inp.value = "";
  }
  kirli = true;
  taslakYaz();
  us();
}

function us() {
  const tb = document.getElementById("stb"),
        ct = document.getElementById("cnt"),
        g  = document.getElementById("gb");

  if (!C) { tb.innerHTML = ""; ct.textContent = "0"; g.disabled = true; return; }

  // Özet, gönderim ve Excel hep aynı sırayı kullansın diye tek kaynaktan
  const items = seciliKalemler();
  ct.textContent = items.length;
  g.disabled = items.length === 0;

  // Girilmiş ama gönderilmemiş miktar varsa rozet bunu hatırlatsın
  if (kirli && items.length) {
    durum("hata", "⚠ " + items.length + " kalem girildi — henüz gönderilmedi");
  }
  tb.innerHTML = items.map(i =>
    '<tr><td style="font-family:monospace;font-size:10px">' + htmlEsc(i.k) + '</td>'
    + '<td>' + htmlEsc(i.a) + '</td>'
    + '<td style="text-align:center;font-weight:700">' + i.m + '</td>'
    + '<td style="text-align:center">' + htmlEsc(i.b) + '</td></tr>').join("");
}

function clr() {
  if (!C) return;
  if (!confirm("Bu outlet için girilen tüm miktarlar silinecek. Emin misiniz?")) return;
  Q[anahtar()] = {};
  kirli = true;
  taslakYaz();
  rl();
  us();
}

/* ================= Sipariş gönderimi ================= */

// Ekranda görülen sırayla döner; Excel satır sırası da bu olur.
function seciliKalemler() {
  if (!C) return [];
  const q = Q[anahtar()] || {};
  const secilen = C.i.filter(i => q[i.k]);
  // Ekranda hangi sırayla görünüyorsa Excel'e de o sırayla gider.
  return grupluSirala(secilen, C.bl ? mutfakKatIndex : undefined)
    .map(i => ({ k: i.k, a: i.a, b: i.b, g: i.g, m: q[i.k] }));
}

async function gonder() {
  if (!C) return;
  const kalemler = seciliKalemler();
  if (!kalemler.length) return;

  if (!confirm(kalemler.length + " kalemlik sipariş depoya gönderilecek.\n\n"
             + "Gönderdikten sonra listeniz sıfırlanır, sipariş depoda kalır.\n"
             + "Gün içinde istediğiniz kadar yeni sipariş gönderebilirsiniz.\n\nGönderilsin mi?")) {
    return;
  }

  const b = document.getElementById("gb");
  b.disabled = true;
  b.textContent = "⏳ Gönderiliyor...";

  try {
    const { data, error } = await SB.rpc("siparis_gonder", {
      p_outlet_kod: C.c, p_outlet_ad: C.n, p_kalemler: kalemler, p_bolum: C.bl
    });
    if (error) throw error;

    // Gönderim başarılı: makbuza yaz, ekranı sıfırla
    makbuzEkle(anahtar(), { no: data.siparis_no, saat: data.saat, kalem: data.kalem });
    Q[anahtar()] = {};
    kirli = false;
    taslakSil(anahtar());
    rl();
    us();
    makbuzCiz();

    b.textContent = "✅ Gönderildi";
    b.classList.add("ok");
    durum("var", "✓ " + data.siparis_no + " gönderildi — " + data.kalem + " kalem, " + data.saat);
    setTimeout(() => {
      b.textContent = "📤 Siparişi Gönder";
      b.classList.remove("ok");
      b.disabled = false;
    }, 3000);

  } catch (e) {
    console.error(e);
    b.textContent = "❌ Gönderilemedi";
    durum("hata", "⚠ Gönderilemedi — internet bağlantınızı kontrol edin, tekrar deneyin");
    setTimeout(() => { b.textContent = "📤 Siparişi Gönder"; b.disabled = false; }, 3000);
  }
}

/* Gönderilmemiş değişiklikle sayfadan çıkışta uyar */
window.addEventListener("beforeunload", e => {
  if (kirli) { e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
</html>
